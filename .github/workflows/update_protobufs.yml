name: "Update protobufs"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Protobufs version tag to sync to (e.g., v2.7.26). Defaults to the latest protobufs release."
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [protobufs-release]

# Regens touch the same generated tree; run them one at a time instead of
# letting two dispatches race on the update branch.
concurrency:
  group: update-protobufs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-protobufs:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be referenced in a step-level `if`
      # (actionlint: "context secrets is not allowed here"). Expose a flag
      # that the auto-merge step can test through the env context instead.
      HAS_AUTOMATION_TOKEN: ${{ secrets.MESHTASTIC_AUTOMATION_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Determine target protobufs version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          cd protobufs
          git fetch --tags

          if [ -n "${INPUT_VERSION}" ]; then
            target="${INPUT_VERSION}"
          elif [ -n "${PAYLOAD_VERSION}" ]; then
            target="${PAYLOAD_VERSION}"
          else
            target=$(git tag --list 'v*' --sort=-version:refname | head -n1)
            if [ -z "${target}" ]; then
              echo "Error: no release tags found in meshtastic/protobufs"
              exit 1
            fi
          fi

          if ! git show-ref --verify --quiet "refs/tags/${target}"; then
            echo "Error: '${target}' is not a valid tag in meshtastic/protobufs"
            exit 1
          fi

          printf 'version=%s\n' "${target}" >> "$GITHUB_OUTPUT"
          echo "Target protobufs version: ${target}"

      - name: Update protobuf submodule to release
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          cd protobufs
          git checkout "${TARGET_VERSION}"
          cd ..

      - name: Download nanopb
        run: |
          curl -L -o nanopb-0.4.8-linux-x86.tar.gz https://jpa.kapsi.fi/nanopb/download/nanopb-0.4.8-linux-x86.tar.gz
          tar xvzf nanopb-0.4.8-linux-x86.tar.gz
          mv nanopb-0.4.8-linux-x86 nanopb-0.4.8

      - name: Install Python dependencies
        run: |
          poetry install --with dev

      - name: Re-generate protocol buffers
        run: |
          ./bin/regen-protobufs.sh

      - name: Create protobufs update PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        with:
          # With the default GITHUB_TOKEN the PR is created fine, but CI on it
          # stays in "approval required" until a maintainer clicks "Approve
          # workflows to run", and the merge is a human decision. Set
          # MESHTASTIC_AUTOMATION_TOKEN (a PAT or GitHub App installation
          # token with contents/pull-requests write access) to get CI and
          # auto-merge with no human clicks.
          token: ${{ secrets.MESHTASTIC_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: update-protobufs/${{ env.TARGET_VERSION }}
          delete-branch: true
          title: "protobufs: ${{ env.TARGET_VERSION }}"
          commit-message: "protobufs: ${{ env.TARGET_VERSION }}"
          body: |
            Regenerated `meshtastic/protobuf` bindings from
            [meshtastic/protobufs ${{ env.TARGET_VERSION }}](https://github.com/meshtastic/protobufs/releases/tag/${{ env.TARGET_VERSION }}).

            Generated by the *Update protobufs* workflow. Diffs under
            `meshtastic/protobuf/` are generated code — review mechanically
            (field additions/renames), not line-by-line.
          add-paths: |
            protobufs
            meshtastic/protobuf

      - name: Enable auto-merge
        # GITHUB_TOKEN cannot enqueue into the master merge queue, so this only
        # runs when MESHTASTIC_AUTOMATION_TOKEN is set.
        if: >-
          ${{
            (steps.pr.outputs.pull-request-operation == 'created' ||
            steps.pr.outputs.pull-request-operation == 'updated') &&
            env.HAS_AUTOMATION_TOKEN == 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.MESHTASTIC_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge for PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --auto --merge
