  publish-to-pypi:
    # The real PyPI upload happens when the GitHub release is published, so
    # the draft release and the merge of the bump PR come first and a human
    # decides when the version goes live. Nothing is uploaded on dispatch.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          # The release tag points at the version-bump commit.
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a binary wheel and a source tarball
        run: |
          python -m pip install --upgrade pip
          pip3 install poetry
          poetry build

      - name: Verify built version matches the release
        run: |
          set -euo pipefail
          BUILT_VERSION="$(poetry version --short)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${BUILT_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Built version ${BUILT_VERSION} does not match release tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Built ${BUILT_VERSION} matches release ${TAG_VERSION}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
