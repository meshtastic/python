name: Make Release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release_create:
    # Dispatch-only: when this workflow also runs on release publish, this job
    # must not fire again on that event (it would create a second bump PR).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      new_sha: ${{ steps.commit_updated.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install poetry

      - name: Bump version
        run: >-
          poetry version patch

      - name: Get version
        id: get_version
        run: >-
          printf 'version=%s\n' "$(poetry version --short)" >> "$GITHUB_OUTPUT"

      - name: Create version bump PR
        id: bump_pr
        uses: peter-evans/create-pull-request@v8
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        with:
          # The release tag points at the bump commit, which must live on a
          # durable branch. It lands on master when this PR is merged with a
          # merge commit (see the PR body note about merge vs squash).
          # With the default GITHUB_TOKEN the PR needs a maintainer click to
          # run CI and merge; set MESHTASTIC_AUTOMATION_TOKEN for fully
          # unattended operation (see update_protobufs.yml).
          token: ${{ secrets.MESHTASTIC_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: release-bump/${{ env.VERSION }}
          delete-branch: true
          title: "bump version to ${{ env.VERSION }}"
          commit-message: "bump version to ${{ env.VERSION }}"
          body: |
            Automated version bump to ${{ env.VERSION }} from the *Make Release*
            workflow.

            The release tag for ${{ env.VERSION }} points at this commit. Merge
            (not squash) so the tag stays reachable from master.
          add-paths: pyproject.toml

      - name: Checkout bump commit
        # create-pull-request commits to the PR branch and leaves the
        # workspace restored to the base branch, so HEAD here is the pre-bump
        # commit. Check out the bump commit so the tag and every build in
        # this workflow use the bumped version.
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.bump_pr.outputs.pull-request-head-sha }}
          persist-credentials: false

      - name: Record release commit
        id: commit_updated
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: actions/create-release@v1
        id: create_release

        with:
          draft: true
          prerelease: true
          release_name: Meshtastic Python ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
          commitish: ${{ steps.commit_updated.outputs.sha }}
          body: |
            Autogenerated by github action, developer should edit as required before publishing...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a binary wheel and a source tarball
        run: >-
          poetry build

      - name: Validate distributions
        # Dry-run for the PyPI upload: twine check validates the metadata PyPI
        # itself would reject (long descriptions, README rendering, metadata
        # syntax) without uploading anything. The real upload happens when the
        # GitHub release is published (publish-to-pypi job).
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

